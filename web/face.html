<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PookieBot Expressive Face & Voice Controller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #050811;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #face-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* Top HUD */
    #status-pill {
      position: absolute;
      top: 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    #speech-hud {
      position: absolute;
      top: 48px;
      font-size: 14px;
      color: #38bdf8;
      font-weight: 500;
      background: rgba(15, 23, 42, 0.5);
      padding: 4px 16px;
      border-radius: 12px;
      pointer-events: none;
      transition: all 0.3s;
    }

    /* Floating control bar for maneuvers & speech */
    #ui-bar {
      position: absolute;
      bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      opacity: 0.35;
      transition: opacity 0.3s ease;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 16px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      max-width: 90vw;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #ui-bar:hover, #ui-bar:focus-within {
      opacity: 0.98;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover {
      background: #38bdf8;
      color: #030712;
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .btn-action {
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(56, 189, 248, 0.5);
      color: #38bdf8;
    }

    .btn-action:hover {
      background: #38bdf8;
      color: #030712;
    }

    .btn-mic {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
    }

    .btn-mic.listening {
      background: #ef4444;
      color: #ffffff;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* 2D Nursery Mini-Map & Trajectory Drawer Modal */
    #minimap-panel {
      position: absolute;
      top: 60px;
      right: 20px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 18px;
      padding: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
      z-index: 50;
    }

    #minimap-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    #map-canvas {
      background: #090d1a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: crosshair;
      touch-action: none;
    }

    .map-tools {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div id="status-pill">PookieBot Face &bull; <span id="conn-status">CONNECTING...</span> &bull; Mood: <span id="emotion-label">NEUTRAL</span></div>
  <div id="speech-hud">Click 🎙️ to talk, tap maneuvers, or open 🗺️ Map to draw paths!</div>

  <!-- Nursery Mini-Map Drawer -->
  <div id="minimap-panel">
    <div id="minimap-header">
      <span>🗺️ NURSERY TRAJECTORY DRAWER</span>
      <button class="btn" style="padding:2px 8px;font-size:11px" onclick="toggleMiniMap()">✖</button>
    </div>
    <canvas id="map-canvas" width="320" height="320"></canvas>
    <div style="font-size:11px;color:#94a3b8">Draw path with finger/mouse, then tap Send Path</div>
    <div class="map-tools">
      <button class="btn btn-action" onclick="sendDrawnPath()">🚀 Send Path</button>
      <button class="btn" onclick="clearDrawnPath()">🧹 Clear</button>
      <button class="btn" onclick="sendRobotCommand('circle')">⭕ Circle</button>
    </div>
  </div>

  <canvas id="face-canvas"></canvas>

  <div id="ui-bar">
    <!-- Live Voice Speech Control -->
    <button class="btn btn-mic" id="mic-btn" onclick="toggleVoiceRecognition()">🎙️ Speak</button>

    <!-- Mini-Map Toggle -->
    <button class="btn btn-action" onclick="toggleMiniMap()">🗺️ Map</button>

    <!-- Visual Servoing Targets -->
    <button class="btn" style="color:#ef4444" onclick="sendRobotCommand('go to red cube')">🟥 Cube</button>
    <button class="btn" style="color:#eab308" onclick="sendRobotCommand('go to yellow ball')">🟡 Ball</button>
    <button class="btn" style="color:#22c55e" onclick="sendRobotCommand('go to green bottle')">🟢 Bottle</button>
    <button class="btn" style="color:#38bdf8" onclick="sendRobotCommand('go to dock')">⚡ Dock</button>

    <!-- Physical AI Maneuvers -->
    <button class="btn btn-action" onclick="sendRobotCommand('dance')">💃 Dance</button>
    <button class="btn btn-action" onclick="sendRobotCommand('patrol nursery')">🛡️ Patrol</button>
    <button class="btn btn-action" onclick="sendRobotCommand('sing lullaby')">🎵 Lullaby</button>
    <button class="btn btn-action" onclick="sendRobotCommand('scan room')">🔍 Scan</button>

    <!-- Direct Motion -->
    <button class="btn" onclick="sendRobotCommand('forward')">⬆️</button>
    <button class="btn" onclick="sendRobotCommand('backward')">⬇️</button>
    <button class="btn" onclick="sendRobotCommand('turn left')">⬅️</button>
    <button class="btn" onclick="sendRobotCommand('turn right')">➡️</button>
    <button class="btn" onclick="sendRobotCommand('stop')" style="color:#f87171">🛑</button>

    <!-- Face Emotions -->
    <button class="btn" onclick="setEmotion('HAPPY')">Happy</button>
    <button class="btn" onclick="setEmotion('LOVING')">Love</button>
    <button class="btn" onclick="toggleFullscreen()">⛶ Full</button>
  </div>

  <script>
    const canvas = document.getElementById('face-canvas');
    const ctx = canvas.getContext('2d');
    const emotionLabel = document.getElementById('emotion-label');
    const speechHud = document.getElementById('speech-hud');
    const connStatus = document.getElementById('conn-status');
    const micBtn = document.getElementById('mic-btn');

    // Canvas sizing
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Eye Engine State
    let currentEmotion = 'NEUTRAL';
    let eyeState = {
      width: 140,
      height: 200,
      spacing: 90,
      cornerRadius: 45,
      scaleX: 1.0,
      scaleY: 1.0,
      offsetX: 0,
      offsetY: 0,
      tiltL: 0,
      tiltR: 0,
      blinkProgress: 0.0,
      glowColor: '#38bdf8',
      lidTopL: 0,
      lidTopR: 0,
      lidBottomL: 0,
      lidBottomR: 0
    };
    let targetState = { ...eyeState };

    // Procedural Blink
    let isBlinking = false;
    function scheduleBlink() {
      setTimeout(() => {
        triggerBlink();
        scheduleBlink();
      }, Math.random() * 3500 + 2500);
    }
    scheduleBlink();

    function triggerBlink() {
      if (isBlinking) return;
      isBlinking = true;
      let start = performance.now();
      function animateBlink(now) {
        let elapsed = now - start;
        let progress = elapsed / 160;
        if (progress < 0.5) eyeState.blinkProgress = progress * 2;
        else if (progress <= 1.0) eyeState.blinkProgress = 2 - (progress * 2);
        else {
          eyeState.blinkProgress = 0;
          isBlinking = false;
          return;
        }
        requestAnimationFrame(animateBlink);
      }
      requestAnimationFrame(animateBlink);
    }

    // Micro-saccades
    setInterval(() => {
      if (currentEmotion === 'SLEEPY') {
        targetState.offsetX = 0;
        targetState.offsetY = 15;
        return;
      }
      targetState.offsetX = (Math.random() - 0.5) * 60;
      targetState.offsetY = (Math.random() - 0.5) * 35;
    }, 2800);

    // Emotion definitions
    function setEmotion(emotion) {
      currentEmotion = emotion.toUpperCase();
      emotionLabel.innerText = currentEmotion;

      switch (currentEmotion) {
        case 'HAPPY':
          targetState.scaleX = 1.05;
          targetState.scaleY = 0.85;
          targetState.tiltL = -0.12;
          targetState.tiltR = 0.12;
          targetState.lidBottomL = 0.45;
          targetState.lidBottomR = 0.45;
          targetState.lidTopL = 0.0;
          targetState.lidTopR = 0.0;
          targetState.glowColor = '#38bdf8';
          playChirpSound('happy');
          break;

        case 'CURIOUS':
          targetState.scaleX = 1.0;
          targetState.scaleY = 1.1;
          targetState.tiltL = -0.25;
          targetState.tiltR = -0.15;
          targetState.lidBottomL = 0.1;
          targetState.lidBottomR = 0.0;
          targetState.lidTopL = 0.0;
          targetState.lidTopR = 0.1;
          targetState.glowColor = '#2dd4bf';
          playChirpSound('curious');
          break;

        case 'LOVING':
          targetState.scaleX = 1.0;
          targetState.scaleY = 0.9;
          targetState.tiltL = 0.08;
          targetState.tiltR = -0.08;
          targetState.lidBottomL = 0.35;
          targetState.lidBottomR = 0.35;
          targetState.glowColor = '#f472b6';
          playChirpSound('love');
          break;

        case 'SLEEPY':
          targetState.scaleX = 0.95;
          targetState.scaleY = 0.45;
          targetState.tiltL = 0.0;
          targetState.tiltR = 0.0;
          targetState.lidTopL = 0.65;
          targetState.lidTopR = 0.65;
          targetState.lidBottomL = 0.1;
          targetState.lidBottomR = 0.1;
          targetState.glowColor = '#818cf8';
          playChirpSound('sleepy');
          break;

        case 'ALERT':
          targetState.scaleX = 1.15;
          targetState.scaleY = 1.15;
          targetState.tiltL = 0;
          targetState.tiltR = 0;
          targetState.lidTopL = 0;
          targetState.lidTopR = 0;
          targetState.lidBottomL = 0;
          targetState.lidBottomR = 0;
          targetState.glowColor = '#fbbf24';
          playChirpSound('curious');
          break;

        case 'NEUTRAL':
        default:
          targetState.scaleX = 1.0;
          targetState.scaleY = 1.0;
          targetState.tiltL = 0;
          targetState.tiltR = 0;
          targetState.lidTopL = 0;
          targetState.lidTopR = 0;
          targetState.lidBottomL = 0;
          targetState.lidBottomR = 0;
          targetState.glowColor = '#38bdf8';
          break;
      }
    }

    // Web Audio Synthesizer
    let audioCtx = null;
    function playChirpSound(type = 'happy') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0.12, now);

        if (type === 'happy') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.18);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'curious') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.linearRampToValueAtTime(740, now + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'love') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.25);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.32);
        } else if (type === 'sleepy') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.linearRampToValueAtTime(330, now + 0.35);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.40);
          osc.start(now);
          osc.stop(now + 0.40);
        }
      } catch (e) {}
    }

    // Speech Synthesizer (Talk Back Voice)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        utter.pitch = 1.25; // Gentle, cute voice
        window.speechSynthesis.speak(utter);
      }
    }

    // Linear interpolation
    function lerp(start, end, factor) {
      return start + (end - start) * factor;
    }

    // Render Loop
    function render() {
      eyeState.scaleX = lerp(eyeState.scaleX, targetState.scaleX, 0.12);
      eyeState.scaleY = lerp(eyeState.scaleY, targetState.scaleY, 0.12);
      eyeState.offsetX = lerp(eyeState.offsetX, targetState.offsetX, 0.1);
      eyeState.offsetY = lerp(eyeState.offsetY, targetState.offsetY, 0.1);
      eyeState.tiltL = lerp(eyeState.tiltL, targetState.tiltL, 0.1);
      eyeState.tiltR = lerp(eyeState.tiltR, targetState.tiltR, 0.1);
      eyeState.lidTopL = lerp(eyeState.lidTopL, targetState.lidTopL, 0.1);
      eyeState.lidTopR = lerp(eyeState.lidTopR, targetState.lidTopR, 0.1);
      eyeState.lidBottomL = lerp(eyeState.lidBottomL, targetState.lidBottomL, 0.1);
      eyeState.lidBottomR = lerp(eyeState.lidBottomR, targetState.lidBottomR, 0.1);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      const eyeW = eyeState.width * eyeState.scaleX;
      const eyeH = eyeState.height * eyeState.scaleY * (1.0 - eyeState.blinkProgress);
      const halfSpacing = eyeState.spacing / 2;

      const leftX = centerX - halfSpacing - eyeW / 2 + eyeState.offsetX;
      const rightX = centerX + halfSpacing + eyeW / 2 + eyeState.offsetX;
      const eyeY = centerY + eyeState.offsetY;

      drawSingleEye(leftX, eyeY, eyeW, eyeH, eyeState.tiltL, eyeState.lidTopL, eyeState.lidBottomL);
      drawSingleEye(rightX, eyeY, eyeW, eyeH, eyeState.tiltR, eyeState.lidTopR, eyeState.lidBottomR);

      requestAnimationFrame(render);
    }

    function drawSingleEye(x, y, w, h, tilt, lidTop, lidBottom) {
      if (h <= 2) return;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);

      ctx.shadowColor = targetState.glowColor;
      ctx.shadowBlur = 45;

      const r = Math.min(eyeState.cornerRadius, h / 2, w / 2);
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, r);

      const grad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, targetState.glowColor);
      grad.addColorStop(1, targetState.glowColor);
      ctx.fillStyle = grad;
      ctx.fill();

      if (lidTop > 0) {
        ctx.fillStyle = '#050811';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.rect(-w / 2 - 5, -h / 2 - 5, w + 10, h * lidTop + 5);
        ctx.fill();
      }

      if (lidBottom > 0) {
        ctx.fillStyle = '#050811';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.rect(-w / 2 - 5, h / 2 - (h * lidBottom), w + 10, h * lidBottom + 5);
        ctx.fill();
      }

      ctx.restore();
    }

    // ========================================================
    // Live WebSocket Client & Command Dispatcher
    // ========================================================
    let ws = null;
    function connectWebSocket() {
      const urlParams = new URLSearchParams(window.location.search);
      const wsHost = urlParams.get('host') || window.location.hostname || 'localhost';
      const wsPort = urlParams.get('port') || '8765';
      const wsUrl = `ws://${wsHost}:${wsPort}`;

      try {
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          connStatus.innerHTML = `<span style="color:#4ade80">● ONLINE (Brain Connected)</span>`;
          speechHud.innerText = "Connected! Click 🎙️ Speak or tap maneuvers below";
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'emotion' && data.emotion) {
              setEmotion(data.emotion);
            } else if (data.type === 'sound' && data.sound) {
              playChirpSound(data.sound);
            } else if (data.type === 'gaze') {
              if (typeof data.x === 'number') targetState.offsetX = data.x;
              if (typeof data.y === 'number') targetState.offsetY = data.y;
            } else if (data.type === 'blink') {
              triggerBlink();
            } else if (data.type === 'response' && data.text) {
              speechHud.innerText = `🤖 "${data.text}"`;
              speakText(data.text);
            } else if (data.type === 'telemetry' && data.telemetry) {
              if (data.telemetry.pose) {
                robotPose = data.telemetry.pose;
                if (isMapVisible) drawMiniMap();
              }
            }
          } catch (e) {}
        };

        ws.onclose = () => {
          connStatus.innerHTML = `<span style="color:#94a3b8">○ STANDALONE</span>`;
          setTimeout(connectWebSocket, 3000);
        };

        ws.onerror = () => ws.close();
      } catch (e) {
        setTimeout(connectWebSocket, 3000);
      }
    }
    connectWebSocket();

    function sendRobotCommand(cmd) {
      speechHud.innerText = `Sending: "${cmd}"...`;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'robot_command', cmd: cmd }));
      } else {
        speechHud.innerText = `Sim offline - start python run_pookiebot.py`;
      }
    }

    // ========================================================
    // Built-in Web Speech API (Voice Recognition)
    // ========================================================
    let recognition = null;
    let isListening = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        micBtn.innerText = "🛑 Listening...";
        speechHud.innerText = "Listening... say 'Dance', 'Approach object', 'Forward', etc.";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        speechHud.innerText = `Heard: "${transcript}"`;
        sendRobotCommand(transcript);
      };

      recognition.onerror = (event) => {
        speechHud.innerText = `Voice error: ${event.error}`;
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerText = "🎙️ Speak";
      };
    } else {
      micBtn.style.display = "none";
      console.warn("Web Speech API not supported in this browser.");
    }

    function toggleVoiceRecognition() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    // ========================================================
    // 2D Nursery Mini-Map & Trajectory Drawer Engine
    // ========================================================
    const mapCanvas = document.getElementById('map-canvas');
    const mapCtx = mapCanvas.getContext('2d');
    const minimapPanel = document.getElementById('minimap-panel');

    let isMapVisible = false;
    let isDrawing = false;
    let drawnWaypoints = [];
    let robotPose = [0.0, 0.0, 0.0]; // [x (m), y (m), yaw (rad)]

    const PPM = 48.0; // Pixels per meter scale
    const ORIGIN_X = 160;
    const ORIGIN_Y = 160;

    function worldToCanvas(x, y) {
      // In MuJoCo: +X is Forward (Up on screen), +Y is Left (Left on screen)
      const cx = ORIGIN_X - (y * PPM);
      const cy = ORIGIN_Y - (x * PPM);
      return { x: cx, y: cy };
    }

    function canvasToWorld(px, py) {
      const y = (ORIGIN_X - px) / PPM;
      const x = (ORIGIN_Y - py) / PPM;
      return [Math.round(x * 100) / 100, Math.round(y * 100) / 100];
    }

    function toggleMiniMap() {
      isMapVisible = !isMapVisible;
      minimapPanel.style.display = isMapVisible ? 'flex' : 'none';
      if (isMapVisible) drawMiniMap();
    }

    function clearDrawnPath() {
      drawnWaypoints = [];
      drawMiniMap();
    }

    function sendDrawnPath() {
      if (drawnWaypoints.length < 2) {
        speechHud.innerText = "Please draw a path on the map first!";
        return;
      }
      speechHud.innerText = `Dispatching drawn path (${drawnWaypoints.length} waypoints)...`;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'follow_path', waypoints: drawnWaypoints }));
      }
    }

    // Pointer events for drawing trajectories on the mini-map
    mapCanvas.addEventListener('pointerdown', (e) => {
      isDrawing = true;
      const rect = mapCanvas.getBoundingClientRect();
      const pt = canvasToWorld(e.clientX - rect.left, e.clientY - rect.top);
      drawnWaypoints = [pt];
      drawMiniMap();
    });

    mapCanvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const rect = mapCanvas.getBoundingClientRect();
      const pt = canvasToWorld(e.clientX - rect.left, e.clientY - rect.top);
      // Filter out points too close to previous point (< 10cm)
      const last = drawnWaypoints[drawnWaypoints.length - 1];
      const dist = Math.hypot(pt[0] - last[0], pt[1] - last[1]);
      if (dist >= 0.10) {
        drawnWaypoints.push(pt);
        drawMiniMap();
      }
    });

    window.addEventListener('pointerup', () => {
      isDrawing = false;
    });

    function drawMiniMap() {
      mapCtx.clearRect(0, 0, 320, 320);

      // 1. Grid lines (0.5m spacing)
      mapCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      mapCtx.lineWidth = 1;
      for (let m = -3; m <= 3; m += 0.5) {
        const pt = worldToCanvas(m, 0);
        mapCtx.beginPath();
        mapCtx.moveTo(0, pt.y);
        mapCtx.lineTo(320, pt.y);
        mapCtx.stroke();

        const pt2 = worldToCanvas(0, m);
        mapCtx.beginPath();
        mapCtx.moveTo(pt2.x, 0);
        mapCtx.lineTo(pt2.x, 320);
        mapCtx.stroke();
      }

      // 2. Play Area Rug (Soft circle at x=0.4, y=0.0, r=1.4m)
      const rug = worldToCanvas(0.4, 0.0);
      mapCtx.fillStyle = 'rgba(241, 245, 249, 0.08)';
      mapCtx.beginPath();
      mapCtx.arc(rug.x, rug.y, 1.4 * PPM, 0, Math.PI * 2);
      mapCtx.fill();
      mapCtx.strokeStyle = 'rgba(241, 245, 249, 0.2)';
      mapCtx.stroke();

      // 3. Room Boundaries (-3m to +3m)
      mapCtx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
      mapCtx.lineWidth = 2;
      const nw = worldToCanvas(3.0, 3.0);
      const se = worldToCanvas(-3.0, -3.0);
      mapCtx.strokeRect(nw.x, nw.y, se.x - nw.x, se.y - nw.y);

      // 4. Nursery Furniture & Target Landmarks
      const landmarks = [
        { name: "Crib 🛏️", x: -1.5, y: 2.0, color: "#cbd5e1", w: 30, h: 45 },
        { name: "Cube 🟥", x: 0.85, y: 0.0, color: "#ef4444", w: 14, h: 14 },
        { name: "Ball 🟡", x: 1.25, y: -0.55, color: "#eab308", radius: 7 },
        { name: "Bottle 🟢", x: 0.70, y: 0.70, color: "#22c55e", radius: 6 },
        { name: "Toybox 🟦", x: -0.75, y: -1.10, color: "#3b82f6", w: 18, h: 14 },
        { name: "Dock ⚡", x: 2.90, y: 0.0, color: "#f8fafc", w: 10, h: 24 }
      ];

      for (const lm of landmarks) {
        const c = worldToCanvas(lm.x, lm.y);
        mapCtx.fillStyle = lm.color;
        if (lm.radius) {
          mapCtx.beginPath();
          mapCtx.arc(c.x, c.y, lm.radius, 0, Math.PI * 2);
          mapCtx.fill();
        } else {
          mapCtx.fillRect(c.x - lm.w / 2, c.y - lm.h / 2, lm.w, lm.h);
        }
        mapCtx.fillStyle = "rgba(255, 255, 255, 0.7)";
        mapCtx.font = "9px sans-serif";
        mapCtx.fillText(lm.name, c.x - 12, c.y - 10);
      }

      // 5. User Drawn Path
      if (drawnWaypoints.length > 0) {
        mapCtx.strokeStyle = "#4ade80";
        mapCtx.lineWidth = 3;
        mapCtx.setLineDash([4, 4]);
        mapCtx.beginPath();
        for (let i = 0; i < drawnWaypoints.length; i++) {
          const wp = worldToCanvas(drawnWaypoints[i][0], drawnWaypoints[i][1]);
          if (i === 0) mapCtx.moveTo(wp.x, wp.y);
          else mapCtx.lineTo(wp.x, wp.y);
        }
        mapCtx.stroke();
        mapCtx.setLineDash([]);

        // Waypoint dots
        for (let i = 0; i < drawnWaypoints.length; i++) {
          const wp = worldToCanvas(drawnWaypoints[i][0], drawnWaypoints[i][1]);
          mapCtx.fillStyle = (i === drawnWaypoints.length - 1) ? "#f43f5e" : "#4ade80";
          mapCtx.beginPath();
          mapCtx.arc(wp.x, wp.y, (i === drawnWaypoints.length - 1) ? 5 : 3, 0, Math.PI * 2);
          mapCtx.fill();
        }
      }

      // 6. Live Robot Body & Heading Arrow
      const bot = worldToCanvas(robotPose[0], robotPose[1]);
      const yaw = robotPose[2]; // Heading angle in radians (0 is +X/forward)

      // Outer glow
      mapCtx.fillStyle = "rgba(56, 189, 248, 0.3)";
      mapCtx.beginPath();
      mapCtx.arc(bot.x, bot.y, 10, 0, Math.PI * 2);
      mapCtx.fill();

      // Robot Chassis representation
      mapCtx.fillStyle = "#38bdf8";
      mapCtx.beginPath();
      mapCtx.arc(bot.x, bot.y, 6, 0, Math.PI * 2);
      mapCtx.fill();

      // Heading arrow: In our map projection:
      // dx_canvas = -sin(yaw) * len, dy_canvas = -cos(yaw) * len
      const arrowLen = 14;
      const headX = bot.x - Math.sin(yaw) * arrowLen;
      const headY = bot.y - Math.cos(yaw) * arrowLen;

      mapCtx.strokeStyle = "#ffffff";
      mapCtx.lineWidth = 2.5;
      mapCtx.beginPath();
      mapCtx.moveTo(bot.x, bot.y);
      mapCtx.lineTo(headX, headY);
      mapCtx.stroke();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    // Touch tap on canvas
    canvas.addEventListener('click', () => {
      const emotions = ['HAPPY', 'CURIOUS', 'LOVING', 'SLEEPY', 'NEUTRAL'];
      const nextIndex = (emotions.indexOf(currentEmotion) + 1) % emotions.length;
      setEmotion(emotions[nextIndex]);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'tap', region: 'screen' }));
      }
    });

    render();
  </script>
</body>
</html>
